name: Build and publish launcher
on:
  push:
    branches: [main]
    paths: ['SteamMonitorLauncher/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: launcher-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run Windows startup checks
        shell: powershell
        run: |
          & .\SteamMonitorLauncher\Install.ps1 -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw 'Windows build/startup validation failed.' }
      - name: Package immutable release and update feed
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content .\SteamMonitorLauncher\version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          $tag = "v$version"
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName
          if ($LASTEXITCODE -ne 0) { throw "Could not list existing releases." }
          if (($releases | ConvertFrom-Json).tagName -contains $tag) { throw "Release $tag already exists. Bump all version markers before publishing another build." }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $zip = "dist/Steam_Monitor_Launcher_v${version}.zip"
          Compress-Archive -Path SteamMonitorLauncher -DestinationPath $zip
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/Steam_Monitor_Launcher_v${version}.zip"
          & .\SteamMonitorLauncher\Publish-Release-Feed.ps1 -PackagePath $zip -PackageUrl $url -Notes "Launcher $version. Full source, installer and live updater. Windows compilation and startup checks passed." -OutputPath dist/latest.json
          gh release create $tag $zip dist/latest.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Steam Monitor Launcher $version" --notes "Full launcher package. Download the ZIP and run Launch Steam Monitor.bat, or use the built-in updater. Windows compilation and startup checks passed; real game and controller behavior require hardware testing." --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing release failed.' }
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation-logs
          path: validation-output/logs
          if-no-files-found: ignore
